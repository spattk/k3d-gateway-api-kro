# Break 2: weeks later, someone creates an unrelated route that happens to be called "chat"
# (an internal health page on a different hostname). The leftover policies attach to it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
  namespace: team-chat
spec:
  parentRefs:
    - name: shared-gw
      namespace: platform
      sectionName: http
  hostnames: ["status.example.com"]
  rules:
    - backendRefs:
        - name: model-8b
          port: 5678
