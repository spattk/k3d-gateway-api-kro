# Break 1: a "harmless" rename PR. Only this file is in the diff.
# The SecurityPolicy and BackendTrafficPolicy still say name: chat.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat-v2
  namespace: team-chat
spec:
  parentRefs:
    - name: shared-gw
      namespace: platform
      sectionName: http
  hostnames: ["chat.example.com"]
  rules:
    - matches:
        - headers:
            - name: x-tier
              value: premium
      backendRefs:
        - name: model-70b
          port: 5678
    - backendRefs:
        - name: model-8b
          port: 5678
